<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PPMS - 생산공정관리시스템</title>

    <link rel="stylesheet" href="/static/common.css">
    <link rel="stylesheet" href="/static/index.css">
    <link href="https://hangeul.pstatic.net/hangeul_static/css/bmdohyeon.css" rel="stylesheet">
    <link href="https://hangeul.pstatic.net/hangeul_static/css/bmjua.css" rel="stylesheet">
    <link rel="stylesheet" href="https://unicons.iconscout.com/release/v2.1.9/css/unicons.css">
    <link href="https://fonts.googleapis.com/css?family=Poppins:400,500,600,700,800,900" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css?family=Roboto+Mono" rel="stylesheet">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

    <script src="/static/auth.js"></script>
    <script src="/static/logo.js"></script>
</head>

<body>
    <div class="page-container">
        <header class="main-header">
            <div class="header-left">
                <a href="/" class="ppms-logo-placeholder"></a>
            </div>
            <div class="header-center">
                <div class="common-box">PPMS PROCESS</div>
            </div>
            <div class="header-right">
                <div class="common-box time-display" id="current-time">
                    <i class="uil uil-clock-eight"></i>
                    <span>Loading...</span>
                </div>
            </div>
        </header>

        <main class="content-area">
            <div class="flow-container">

                <a href="/api/production/view" onclick="transitionToPage(event, '/api/production/view')">
                    <div class="grid-item">
                        <div class="icon-container">
                            <i class="uil uil-box main-icon"></i> <i class="uil uil-cog hover-icon"></i>
                        </div>
                        <span>생 산</span>
                    </div>
                </a>

                <div class="flow-arrow">
                    <i class="uil uil-angle-double-right flow-arrow-icon"></i>
                    <div class="branch-container">
                        <div class="branch-line-dashed"></div>
                        <i class="uil uil-angle-double-up flow-arrow-icon-vertical"></i>

                        <a href="/api/dip/view" class="branch-item-link"
                            onclick="transitionToPage(event, '/api/dip/view')">
                            <div class="sub-grid-item">
                                <div class="icon-container">
                                    <i class="uil uil-processor main-icon"></i>
                                    <i class="uil uil-circuit hover-icon"></i>
                                </div>
                                <span>조 립</span>
                            </div>
                        </a>
                    </div>
                </div>

                <a href="/api/aoi/view" onclick="transitionToPage(event, '/api/aoi/view')">
                    <div class="grid-item">
                        <div class="icon-container">
                            <i class="uil uil-eye main-icon"></i>
                            <i class="uil uil-search-alt hover-icon"></i>
                        </div>
                        <span>AOI</span>
                    </div>
                </a>

                <div class="flow-arrow">
                    <i class="uil uil-angle-double-right flow-arrow-icon"></i>
                </div>

                <a href="/api/repair/view" onclick="transitionToPage(event, '/api/repair/view')">
                    <div class="grid-item">
                        <div class="icon-container">
                            <i class="uil uil-wrench main-icon"></i>
                            <i class="uil uil-screw hover-icon"></i>
                        </div>
                        <span>수 리</span>
                    </div>
                </a>

                <div class="flow-arrow">
                    <i class="uil uil-angle-double-right flow-arrow-icon"></i>
                </div>

                <a href="/api/function_test/view" onclick="transitionToPage(event, '/api/function_test/view')">
                    <div class="grid-item">
                        <div class="icon-container">
                            <i class="uil uil-laptop main-icon"></i>
                            <i class="uil uil-check-circle hover-icon"></i>
                        </div>
                        <span>기 능</span>
                    </div>
                </a>

            </div> </main> <footer class="main-footer">
            <div class="footer-left" style="display: flex; gap: 10px;">
                <a href="/api/inspection/dashboard" onclick="transitionToPage(event, '/api/inspection/dashboard')" style="text-decoration: none;">
                    <div class="inspection-footer-btn">
                        <i class="uil uil-file-check-alt" style="font-size: 1.3rem;"></i>
                        <span>점검 시트</span>
                    </div>
                </a>
            </div>

            <div class="footer-center">
                <div class="common-box" id="footer-center-content" style="font-size: 0.9rem; opacity: 0.7;">
                    © PHILIA TELECOM
                </div>
            </div>

            <div class="footer-right">
                <div class="footer-btn icon-logout" id="logout-btn">Logout</div>
            </div>
        </footer>
    </div>

    <style>
        body {
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
        }

        /* 맘에 들어하셨던 금색 테두리와 반투명 배경을 푸터 버튼 규격에 맞춤 */
        .inspection-footer-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 0 20px;
            height: 45px;
            border-radius: 12px;
            border: 1px solid rgba(255, 235, 167, 0.4);
            background: rgba(255, 235, 167, 0.05);
            color: var(--point-gold, #ffeba7);
            font-family: 'BMDOHYEON';
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }

        .inspection-footer-btn:hover {
            background: rgba(255, 235, 167, 0.2);
            border-color: var(--point-gold, #ffeba7);
            transform: translateY(-3px);
            box-shadow: 0 6px 15px rgba(255, 235, 167, 0.2);
            color: #fff;
        }
    </style>

    <script>
        window.addEventListener('pageshow', (event) => {
            document.body.style.opacity = '1';
        });

        function transitionToPage(e, url) {
            e.preventDefault();
            document.body.style.opacity = '0';
            setTimeout(() => {
                window.location.href = url;
            }, 500);
        }

        document.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                document.body.style.opacity = '1';
            }, 50);

            const userRole = localStorage.getItem('ppms_user_role');
            if (!userRole) {
                window.location.href = '/api/auth/login_view';
                return;
            }

            setupLogoutButton();
            setInterval(updateTime, 1000);
            updateTime();

            const footerCenterContent = document.getElementById('footer-center-content');
            if (userRole === 'admin' && footerCenterContent) {
                const centerDiv = document.querySelector('.footer-center');
                centerDiv.innerHTML = '';

                const adminLink = document.createElement('a');
                adminLink.href = '/api/production/admin_view';

                const adminBtn = document.createElement('div');
                adminBtn.className = 'footer-btn';
                adminBtn.textContent = '관리자 페이지';

                adminLink.appendChild(adminBtn);
                centerDiv.appendChild(adminLink);
            }
        });

        function updateTime() {
            const timeDisplay = document.querySelector('#current-time span');
            if (!timeDisplay) return;
            const now = new Date();

            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');

            timeDisplay.textContent = `${year}.${month}.${day} ${hours}:${minutes}`;
        }
    </script>
</body>
</html>

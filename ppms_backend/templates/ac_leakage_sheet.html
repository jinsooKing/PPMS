<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PPMS - AC 누설전류 점검</title>
    <link rel="stylesheet" href="/static/common.css">
    <link rel="stylesheet" href="https://unicons.iconscout.com/release/v4.0.8/css/line.css">
    <link href="https://hangeul.pstatic.net/hangeul_static/css/bmdohyeon.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css?family=Poppins:400,600,800" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="/static/logo.js"></script>
    <style>
        .content-area { box-sizing: border-box; overflow-x: hidden; }
        .ac-inner{display:flex;flex-direction:column;width:100%;height:100%;gap:8px;box-sizing:border-box;min-width:0;}
        .ctrl-bar{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;background:var(--card-bg);border:1px solid var(--border-color);border-radius:10px;padding:8px 16px;gap:12px;}
        .year-ctrl{display:flex;align-items:center;gap:10px;font-family:'BMDOHYEON';font-size:1.1rem;color:#fff;}
        .arrow-btn{background:none;border:1px solid #555;color:var(--point-gold);width:28px;height:28px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:.95rem;transition:all .2s;}
        .arrow-btn:hover{background:var(--point-gold);color:#1f2029;}
        .table-wrapper{flex:1;min-height:0;overflow:auto;background:var(--card-bg);border-radius:12px;border:1px solid var(--border-color);}
        table{width:100%;border-collapse:collapse;}
        th,td{border:1px solid #3a3b47;text-align:center;padding:0;}
        th{background:#1a1b21;color:var(--point-gold);font-family:'BMDOHYEON';padding:8px 4px;font-size:.82rem;position:sticky;top:0;z-index:20;white-space:nowrap;}
        .line-col{position:sticky;left:0;background:#1a1b21;z-index:30;min-width:50px;font-family:'BMDOHYEON';font-size:.85rem;}
        th.line-col{z-index:40;}
        .equip-col{position:sticky;left:50px;background:#1a1b21;z-index:30;min-width:100px;text-align:left;padding:5px 8px;font-size:.8rem;border-right:2px solid var(--point-gold);color:#ccc;white-space:nowrap;}
        th.equip-col{z-index:40;color:var(--point-gold);left:50px;}
        .month-col{min-width:70px;height:46px;padding:0!important;}
        .val-cell{width:100%;height:46px;display:flex;align-items:center;justify-content:center;}
        .val-input{background:transparent;border:none;text-align:center;font-size:.85rem;width:90%;outline:none;font-family:'Poppins';color:#fff;
            -moz-appearance:textfield;}
        .val-input::-webkit-inner-spin-button,
        .val-input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0;}
        .val-input:focus{border-bottom:1px solid var(--point-gold);}
        .val-ok{color:var(--success-green);}
        .val-ng{color:var(--danger-red);background:rgba(255,68,68,.1);}
        /* ③ cur-month 헤더: 불투명 배경으로 스크롤 침범 방지 */
        .cur-month{background:rgba(255,235,167,.06) !important;}
        th.cur-month{background:#1e2535 !important;border-bottom:2px solid var(--point-gold) !important;color:var(--point-gold)!important;}
        .line-a{color:#4e73df;font-weight:bold;}
        .line-b{color:#00e676;font-weight:bold;}
        .line-c{color:var(--point-gold);font-weight:bold;}
    </style>
</head>
<body>
    <div class="page-container">
        <header class="main-header">
            <div class="header-left">
                <a href="javascript:void(0)" onclick="goToHome()" class="ppms-logo-placeholder"></a>
            </div>
            <div class="header-center">
                <div class="common-box font-35pt">AC 누설전류 점검</div>
            </div>
            <div class="header-right">
                <div class="common-box font-15pt time-display" id="current-time"></div>
            </div>
        </header>
        <main class="content-area">
            <div class="ac-inner">
                <div class="ctrl-bar">
                    <div class="year-ctrl">
                        <button class="arrow-btn" onclick="moveYear(-1)"><i class="uil uil-angle-left"></i></button>
                        <span id="year-display"></span>
                        <button class="arrow-btn" onclick="moveYear(1)"><i class="uil uil-angle-right"></i></button>
                        <button class="quick-ok-btn" onclick="scrollToThisMonth()" style="border-color:#888;color:#aaa;">이번달로 이동</button>
                        <div class="ctrl-divider"></div>
                        <button class="quick-ok-btn" onclick="applyPreset()">프리셋 적용</button>
                    </div>
                    <div style="font-size:.82rem;color:#888;">
                        기준: <strong style="color:var(--success-green);">AC 5V 이하</strong> &nbsp;|&nbsp;
                        점검주기: 월 1회 (매월 2주차 월요일) &nbsp;|&nbsp;
                        수치 직접 입력 → 5V 초과 시 자동 NG 표시
                    </div>
                </div>
                <div class="table-wrapper">
                    <table id="ac-table">
                        <thead><tr id="header-row"></tr></thead>
                        <tbody id="table-body"></tbody>
                    </table>
                </div>
            </div>
        </main>
        <footer class="main-footer">
            <div class="footer-left">
                <div class="inspection-footer-btn" onclick="openPresetModal()" style="cursor:pointer;">
                    <i class="uil uil-setting"></i> 프리셋 설정
                </div>
            </div>
            <div class="footer-center">
                <div class="footer-btn" onclick="goBack()"><i class="uil uil-arrow-left"></i></div>
                <div class="footer-btn" onclick="goToHome()"><i class="uil uil-home"></i></div>
                <div class="footer-btn" onclick="goForward()"><i class="uil uil-arrow-right"></i></div>
            </div>
            <div class="footer-right"></div>
        </footer>
    </div>
    <style>body{opacity:0;transition:opacity .5s ease-in-out}
    .quick-ok-btn{background:none;border:1px solid #4e73df;color:#4e73df;padding:3px 10px;border-radius:6px;cursor:pointer;font-size:.8rem;font-family:'BMDOHYEON';transition:all .2s;}
    .quick-ok-btn:hover{opacity:.75;}
    .ctrl-btn-group{display:flex;gap:6px;align-items:center;}
    .ctrl-divider{width:1px;height:18px;background:#444;margin:0 4px;}
    .inspection-footer-btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:0 20px;height:45px;border-radius:12px;border:1px solid rgba(255,235,167,.4);background:rgba(255,235,167,.05);color:var(--point-gold);font-family:'BMDOHYEON';font-size:1rem;cursor:pointer;transition:all .3s;}
    .inspection-footer-btn:hover{background:rgba(255,235,167,.2);border-color:var(--point-gold);}
    .preset-modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:12000;align-items:center;justify-content:center;}
    .preset-modal-overlay.visible{display:flex;}
    .preset-modal{background:#1a1c23;border:1px solid var(--point-gold);border-radius:12px;width:520px;max-height:82vh;display:flex;flex-direction:column;}
    .preset-modal-header{display:flex;justify-content:space-between;align-items:center;padding:18px 24px;border-bottom:1px solid rgba(255,255,255,.08);}
    .preset-modal-title{color:var(--point-gold);font-family:'BMDOHYEON';font-size:1.2rem;}
    .preset-modal-body{padding:20px 24px;overflow-y:auto;display:flex;flex-direction:column;gap:10px;}
    .preset-section-title{color:var(--point-gold);font-family:'BMDOHYEON';font-size:.95rem;border-bottom:1px solid rgba(255,235,167,.2);padding-bottom:4px;margin-top:6px;}
    .preset-row{display:flex;align-items:center;gap:10px;}
    .preset-label{color:#bbb;font-size:.88rem;min-width:160px;}
    .preset-input{background:#222;border:1px solid #444;color:#fff;padding:5px 8px;border-radius:6px;width:80px;text-align:center;}
    .preset-input:focus{outline:none;border-color:var(--point-gold);}
    .preset-unit{color:#777;font-size:.82rem;}
    .preset-modal-footer{padding:16px 24px;border-top:1px solid rgba(255,255,255,.08);display:flex;justify-content:flex-end;gap:10px;}
    .preset-save-btn{background:var(--point-gold);color:#1a1c23;border:none;padding:8px 24px;border-radius:20px;font-family:'BMJUA';font-size:.95rem;cursor:pointer;font-weight:bold;}
    .preset-cancel-btn{background:#3d3d3d;color:#eee;border:none;padding:8px 20px;border-radius:20px;font-family:'BMJUA';cursor:pointer;}
    </style>

    <!-- 프리셋 설정 모달 -->
    <div class="preset-modal-overlay" id="preset-modal">
        <div class="preset-modal">
            <div class="preset-modal-header">
                <span class="preset-modal-title"><i class="uil uil-setting"></i> AC 누설전류 프리셋 설정</span>
                <button onclick="closePresetModal()" style="background:none;border:none;color:#888;font-size:1.8rem;cursor:pointer;line-height:1;">&times;</button>
            </div>
            <div class="preset-modal-body" id="preset-modal-body">
                <!-- JS로 동적 생성 -->
            </div>
            <div class="preset-modal-footer">
                <button class="preset-cancel-btn" onclick="closePresetModal()">취소</button>
                <button class="preset-save-btn" onclick="savePreset()">저장</button>
            </div>
        </div>
    </div>
    <script>
    const LINES={
        'A':['LOADER','PRINTER','Mounter1','Mounter2','Mounter3','WORK TABLE','Reflow','UNLOADER'],
        'B':['LOADER','PRINTER','Mounter1','Mounter2','Mounter3','WORK TABLE','Reflow','UNLOADER'],
        'C':['LOADER','PRINTER','Mounter1','WORK TABLE','제습기','CONVECTION OVEN']
    };
    const MONTHS=['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
    let viewYear=new Date().getFullYear(), yearData={};

    function renderTable(){
        const curMonth=new Date().getMonth()+1;
        document.getElementById('year-display').textContent=`${viewYear}년`;

        // 헤더
        let hHtml=`<th class="line-col">라인</th><th class="equip-col">설비명</th>`;
        for(let m=1;m<=12;m++){
            hHtml+=`<th class="month-col ${m===curMonth?'cur-month':''}" data-month="${m}">${MONTHS[m-1]}</th>`;
        }
        document.getElementById('header-row').innerHTML=hHtml;

        // 바디
        let bHtml='';
        Object.keys(LINES).forEach(line=>{
            LINES[line].forEach((equip,i)=>{
                const lineClass=`line-${line.toLowerCase()}`;
                bHtml+=`<tr>
                    ${i===0?`<td class="line-col" rowspan="${LINES[line].length}" style="font-size:1rem;" ><span class="${lineClass}">${line}</span></td>`:''}
                    <td class="equip-col">${equip}</td>`;
                for(let m=1;m<=12;m++){
                    const key=`${line}_${equip}_${m}`;
                    const rec=yearData[key]||{};
                    const val=(rec.voltage!==null&&rec.voltage!==undefined)?rec.voltage:'';
                    const isNg=val!==''&&parseFloat(val)>5;
                    bHtml+=`<td class="month-col ${m===curMonth?'cur-month':''}">
                        <div class="val-cell">
                            <input class="val-input ${isNg?'val-ng':val!==''?'val-ok':''}"
                                type="number" step="0.1" min="0"
                                value="${val}" placeholder="-"
                                data-line="${line}" data-equip="${equip}" data-month="${m}"
                                onblur="saveVal(this)">
                        </div></td>`;
                }
                bHtml+='</tr>';
            });
        });
        document.getElementById('table-body').innerHTML=bHtml;
    }

    async function saveVal(input){
        const val=input.value===''?null:parseFloat(input.value);
        const status=val===null?'':(val>5?'NG':'OK');
        input.className=`val-input ${status==='NG'?'val-ng':val!==null?'val-ok':''}`;
        const key=`${input.dataset.line}_${input.dataset.equip}_${input.dataset.month}`;
        yearData[key]={voltage:val,status};
        try{
            await fetch('/api/smd_check/ac_leakage/save',{method:'POST',headers:{'Content-Type':'application/json'},
                body:JSON.stringify({year:viewYear,month:parseInt(input.dataset.month),line:input.dataset.line,equipment:input.dataset.equip,voltage:val,status})});
        }catch(e){console.error(e);}
    }

    async function loadData(){
        try{const r=await fetch(`/api/smd_check/ac_leakage/yearly?year=${viewYear}`);yearData=r.ok?await r.json():{};}
        catch(e){yearData={};}renderTable();
    }
    function moveYear(d){viewYear+=d;loadData();}

    // ── 이번달로 이동 ─────────────────────────────────────
    function scrollToThisMonth(){
        const curMonth = new Date().getMonth()+1;
        if(viewYear !== new Date().getFullYear()){viewYear=new Date().getFullYear();loadData();return;}
        const th = document.querySelector(`th[data-month="${curMonth}"]`);
        if(th) th.scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'});
    }

    // ── 프리셋 ────────────────────────────────────────────
    let acPreset = {};

    async function loadPreset(){
        try{
            const res = await fetch('/api/smd_check/preset/ac_leakage');
            const data = await res.json();
            acPreset = data.preset_data || {};
        }catch(e){ acPreset={}; }
    }

    function buildPresetModal(){
        const body = document.getElementById('preset-modal-body');
        let html = '';
        Object.keys(LINES).forEach(line=>{
            html += `<div class="preset-section-title">${line} LINE</div>`;
            LINES[line].forEach(equip=>{
                const key = `${line}_${equip}`;
                const val = acPreset[key] ?? '';
                html += `<div class="preset-row">
                    <span class="preset-label">${equip}</span>
                    <input class="preset-input" id="p-${key}" type="number" step="0.01" placeholder="예: 0.5" value="${val}">
                    <span class="preset-unit">V</span>
                </div>`;
            });
        });
        body.innerHTML = html;
    }

    function openPresetModal(){
        buildPresetModal();
        document.getElementById('preset-modal').classList.add('visible');
    }
    function closePresetModal(){
        document.getElementById('preset-modal').classList.remove('visible');
    }
    async function savePreset(){
        const data = {};
        Object.keys(LINES).forEach(line=>{
            LINES[line].forEach(equip=>{
                const key = `${line}_${equip}`;
                const val = parseFloat(document.getElementById(`p-${key}`)?.value);
                if(!isNaN(val)) data[key] = val;
            });
        });
        try{
            await fetch('/api/smd_check/preset/ac_leakage',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({preset_data:data})});
            acPreset = data;
            closePresetModal();
            alert('프리셋이 저장되었습니다.');
        }catch(e){alert('저장 실패');}
    }

    async function applyPreset(){
        if(!Object.keys(acPreset).length){ alert('저장된 프리셋이 없습니다.\n프리셋 설정 버튼으로 먼저 값을 설정해주세요.'); return; }
        const curMonth = new Date().getMonth()+1;
        // 현재 연도가 다르면 이동
        if(viewYear !== new Date().getFullYear()){ viewYear=new Date().getFullYear(); await loadData(); }

        const ps = [];
        Object.keys(LINES).forEach(line=>{
            LINES[line].forEach(equip=>{
                const key = `${line}_${equip}`;
                const acKey = `${line}_${equip}_${curMonth}`;
                // 이미 값이 있는 셀은 덮어쓰지 않음
                if(yearData[acKey]?.voltage != null) return;
                const voltage = acPreset[key];
                if(voltage == null) return;
                const status = voltage > 5 ? 'NG' : 'OK';
                yearData[acKey] = {voltage, status};
                ps.push(fetch('/api/smd_check/ac_leakage/save',{method:'POST',headers:{'Content-Type':'application/json'},
                    body:JSON.stringify({year:viewYear,month:curMonth,line,equipment:equip,voltage,status})}));
            });
        });
        await Promise.all(ps);
        renderTable();
    }
    // ─────────────────────────────────────────────────────
    function updateTime(){const n=new Date(),el=document.getElementById('current-time');if(el)el.textContent=`${n.getFullYear()}년 ${n.getMonth()+1}월 ${n.getDate()}일 ${n.getHours()}시 ${n.getMinutes()}분`;}
    setInterval(updateTime,1000);updateTime();
    window.addEventListener('pageshow',()=>setTimeout(()=>document.body.style.opacity='1',50));
    window.goBack=()=>{document.body.style.opacity='0';setTimeout(()=>history.back(),500);};
    window.goToHome=()=>{document.body.style.opacity='0';setTimeout(()=>location.href='/',500);};
    window.goForward=()=>{document.body.style.opacity='0';setTimeout(()=>history.forward(),500);};
    window.onload = async () => { await loadPreset(); await loadData(); };
    </script>
</body>
</html>

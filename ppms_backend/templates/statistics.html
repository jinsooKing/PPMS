<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PPMS - 통계 분석</title>

    <link rel="stylesheet" href="/static/common.css">
    <link rel="stylesheet" href="/static/aoi.css">
    <link rel="stylesheet" href="/static/statistics.css">

    <link href="https://hangeul.pstatic.net/hangeul_static/css/bmdohyeon.css" rel="stylesheet">
    <link href="https://hangeul.pstatic.net/hangeul_static/css/bmjua.css" rel="stylesheet">
    <link rel="stylesheet" href="https://unicons.iconscout.com/release/v2.1.9/css/unicons.css">
    <link href="https://fonts.googleapis.com/css?family=Poppins:400,500,600,700,800,900" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css?family=Roboto+Mono" rel="stylesheet">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <!-- 인쇄 전용 영역 (평소엔 숨김, @media print에서만 표시) -->
    <div id="print-area" style="display:none;">
        <span id="print-header" style="display:none;"></span>
        <div id="print-body"></div>
    </div>

    <script src="/static/auth.js"></script>
    <script src="/static/logo.js"></script>

    <style>
        body {
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
        }

        /* [통계 페이지 전용 스타일 오버라이드] */
        html {
            font-size: clamp(14px, 1.1vw, 18px);
        }

        .content-area {
            display: flex;
            flex-direction: column;
            align-items: center !important;
            justify-content: flex-start;
            padding: 20px 0 !important;
            gap: 20px;
            width: 100%;
            box-sizing: border-box;
        }

        .analysis-toolbar,
        #statistics-result-area {
            width: 98% !important;
            max-width: 2560px;
            margin-left: auto;
            margin-right: auto;
        }

        .statistics-table th,
        .summary-table th {
            font-size: 1.05rem;
        }

        .statistics-table td,
        .summary-table td {
            font-size: 0.95rem;
        }

        #aoi-summary-container {
            width: 100% !important;
            height: auto !important;
            overflow-y: visible !important;
            overflow-x: auto;
            margin-bottom: 15px;
            border: 2px solid var(--point-gold);
            flex-shrink: 0;
            padding: 5px !important;
            background-color: #15151a;
        }

        .analysis-toolbar {
            width: clamp(800px, 95vw, 1600px) !important;
            margin: 15px auto !important;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        #statistics-result-area {
            width: 100% !important;
            max-width: none !important;
            margin: 0 !important;
            padding: 0 !important;
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start !important;
            background-color: rgba(0, 0, 0, 0.2);
            overflow-y: auto;
            border-radius: 0;
        }

        #statistics-result-area:has(.no-line-data-message[style*="display: flex"]) {
            justify-content: center !important;
        }

        .analysis-toolbar::-webkit-scrollbar {
            height: 0;
            width: 0;
        }

        .tab-group {
            display: flex;
            gap: 5px;
            background: rgba(0, 0, 0, 0.2);
            padding: 3px;
            border-radius: 8px;
            flex-shrink: 0;
        }

        .tab-btn {
            padding: 6px clamp(10px, 1.5vw, 18px);
            color: #888;
            border-radius: 6px;
            font-family: 'BMDOHYEON', sans-serif;
            font-size: clamp(0.85rem, 1vw, 1rem);
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .tab-btn:hover {
            color: #ccc;
            background-color: rgba(255, 255, 255, 0.05);
        }

        .tab-btn.active {
            background-color: var(--point-gold);
            color: var(--accent-blue);
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }

        .control-wrapper {
            display: none;
            align-items: center;
            gap: clamp(8px, 1.5vw, 15px);
            animation: fadeInRight 0.3s ease;
            flex-shrink: 0;
        }

        .control-wrapper.active {
            display: flex;
        }

        @keyframes fadeInRight {
            from {
                opacity: 0;
                transform: translateX(10px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .compact-select,
        .compact-input {
            background-color: #15151a;
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 6px;
            padding: 4px 8px;
            font-family: 'Poppins', 'BMJUA', sans-serif;
            font-size: clamp(0.8rem, 0.9vw, 0.95rem);
            height: 34px;
            outline: none;
            text-align: center;
        }

        .compact-select:focus,
        .compact-input:focus {
            border-color: var(--point-gold);
            box-shadow: 0 0 5px rgba(255, 235, 167, 0.2);
        }

        .compact-btn {
            padding: 0 clamp(15px, 2vw, 25px) !important;
            height: 34px !important;
            font-size: clamp(0.85rem, 0.9vw, 0.95rem) !important;
            white-space: nowrap;
        }

        .pdf-btn {
            padding: 0 clamp(12px, 1.5vw, 20px) !important;
            height: 34px !important;
            font-size: clamp(0.85rem, 0.9vw, 0.95rem) !important;
            white-space: nowrap;
            background: transparent !important;
            border: 1px solid rgba(255, 100, 100, 0.5) !important;
            color: #ff8080 !important;
            border-radius: 6px !important;
            cursor: pointer;
            font-family: 'BMDOHYEON', sans-serif;
            display: none;
            align-items: center;
            gap: 5px;
            transition: all 0.2s;
        }
        .pdf-btn:hover {
            background: rgba(255, 100, 100, 0.12) !important;
            border-color: #ff8080 !important;
            color: #ffaaaa !important;
        }
        .pdf-btn.visible { display: flex; }

        .period-toggle {
            display: flex;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 6px;
            padding: 2px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .period-option {
            padding: 4px 10px;
            font-size: clamp(0.75rem, 0.8vw, 0.85rem);
            cursor: pointer;
            border-radius: 4px;
            color: #aaa;
            transition: all 0.2s;
            font-family: 'BMDOHYEON';
        }

        .period-option.active {
            background-color: var(--accent-blue);
            color: #fff;
            font-weight: bold;
        }

        .table-container {
            flex: 1 !important;
            width: 100% !important;
            overflow: auto !important;
            min-height: 0 !important;
            height: auto !important;
            max-height: none !important;
        }

        #aoi-table-main .detail-col {
            display: table-cell !important;
        }

        #aoi-table-main col.detail-col {
            display: table-column !important;
        }

        #aoi-table-main .sum-header {
            display: none !important;
        }

        #aoi-table-main thead th,
        .statistics-table thead th {
            position: sticky;
            top: 0;
            z-index: 200;
        }

        #aoi-table-main thead th.model-name-ellipsis {
            z-index: 600 !important;
            left: 0 !important;
        }

        .summary-table th,
        .summary-table td {
            border: 1px solid rgba(255, 235, 167, 0.3);
            padding: 6px 8px !important;
            font-size: 0.85rem !important;
            white-space: nowrap;
            line-height: 1.2;
        }

        #prod-table-container,
        #aoi-table-container {
            width: 100% !important;
            flex: 0 1 auto !important;
            max-height: 75vh;
            overflow: auto;
            border: 2px solid var(--point-gold) !important;
            background-color: #1f2029;
            box-sizing: border-box;
            margin-bottom: 20px;
        }

        #aoi-table-main thead tr:nth-child(1) th {
            position: sticky !important;
            top: 0;
            z-index: 210;
            background-color: #15151a !important;
        }

        #aoi-table-main thead tr:nth-child(2) th {
            position: sticky !important;
            top: 40px;
            z-index: 200;
            background-color: #15151a !important;
        }

        #aoi-table-main thead tr:nth-child(1) th:first-child {
            z-index: 600 !important;
            left: 0 !important;
        }

        #aoi-table-main thead th.model-name-ellipsis {
            position: sticky !important;
            left: 0 !important;
            z-index: 600 !important;
            background-color: #15151a !important;
            box-shadow: 2px 0 5px rgba(0, 0, 0, 0.3);
        }

        #aoi-table-main input {
            pointer-events: auto !important;
            cursor: default !important;
        }

        #aoi-table-main input[type="text"] {
            cursor: pointer !important;
        }

        #aoi-table-main input:focus {
            box-shadow: inset 0 0 0 1px var(--point-gold) !important;
            background-color: rgba(255, 235, 167, 0.05) !important;
        }

        #aoi-table-main input::placeholder {
            color: rgba(255, 255, 255, 0.2);
            font-weight: normal;
        }

        .statistics-table th {
            background-color: #15151a;
            color: var(--point-gold);
            padding: 12px;
            font-size: 0.95rem;
            border-bottom: 2px solid var(--point-gold);
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
        }

        .statistics-table td {
            padding: 10px 5px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 0.9rem;
            vertical-align: middle;
        }

        .stats-clickable-val {
            cursor: pointer;
            font-weight: bold;
            color: var(--point-gold);
            text-decoration: underline;
            text-underline-offset: 3px;
            transition: all 0.2s;
        }

        .stats-clickable-val:hover {
            color: #fff;
            text-decoration-color: #fff;
        }

        .stats-lot-val {
            color: #888;
            font-size: 0.85em;
        }

        .stats-problem-yellow {
            color: #FF3D00 !important;
        }

        .stats-problem-red {
            color: #EA00FF !important;
        }

        #details-modal-content a {
            color: var(--point-gold);
            text-decoration: underline;
            text-underline-offset: 3px;
            transition: color 0.2s;
        }

        #details-modal-content a:hover {
            color: #fff;
        }

        #global-viewer {
            position: fixed;
            display: none;
            z-index: 9999;
            background: rgba(30, 30, 40, 0.95);
            backdrop-filter: blur(5px);
            border: 1px solid var(--point-gold);
            border-radius: 8px;
            padding: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            color: #fff;
            min-width: 200px;
            max-width: 400px;
            font-size: 0.9rem;
            line-height: 1.5;
            white-space: pre-wrap;
            pointer-events: none;
        }

        #model-tooltip-simple {
            position: fixed;
            display: none;
            background: rgba(30, 30, 40, 0.95);
            color: #fff;
            padding: 8px 12px;
            border-radius: 6px;
            z-index: 10000;
            font-size: 0.9rem;
            pointer-events: none;
            border: 1px solid var(--point-gold);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.5);
            font-family: 'Poppins', sans-serif;
        }

        .summary-table {
            width: 100%;
            border-collapse: collapse;
            table-layout: auto;
        }

        .summary-accent {
            font-size: 1.1rem !important;
        }

        .summary-title-cell {
            background-color: var(--card-bg);
            color: var(--point-gold);
            width: 6%;
        }

        .summary-label-cell {
            background-color: #1a1b23;
            color: #aaa;
            font-size: 0.8rem;
        }

        .summary-highlight-row {
            background-color: rgba(255, 235, 167, 0.05);
            color: var(--point-gold);
            font-weight: bold;
        }

        .summary-value-row {
            color: #fff;
        }

        #aoi-summary-container {
            width: 100% !important;
            height: auto !important;
            flex: 0 0 auto !important;
            margin-bottom: 10px;
            border: 2px solid var(--point-gold);
            padding: 3px !important;
            background-color: #15151a;
            box-sizing: border-box;
        }

        .no-line-data-message {
            margin: 0 !important;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            color: #888;
            font-size: 1.2rem;
            gap: 15px;
            text-align: center;
        }

        /* ── 인쇄 스타일 ── */
        @page { size: A4 landscape; margin: 10mm; }

        @media print {
            /* 인쇄할 영역만 남기고 전부 숨김 */
            body * { visibility: hidden; }
            #print-area, #print-area * { visibility: visible; }
            #print-area {
                position: fixed; inset: 0;
                background: #fff !important;
                color: #111 !important;
                padding: 0;
                box-sizing: border-box;
                overflow: visible;
            }

            /* ── 핵심: 모든 자식 색상/배경/스크롤 초기화 ── */
            #print-area * {
                overflow: visible !important;
                max-height: none !important;
                max-width: none !important;
                height: auto !important;
                position: static !important;
                /* 텍스트는 전부 진한 색으로 */
                color: #1a1a1a !important;
                /* 배경은 전부 흰색으로 */
                background: #fff !important;
                background-color: #fff !important;
                /* 테두리 색도 밝은 계열에서 회색으로 */
                border-color: #bbb !important;
                /* 밝은 폰트 굵기 */
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }

            /* 인쇄 헤더 */
            #print-header {
                display: block !important;
                font-size: 10pt;
                font-weight: bold;
                color: #4a3800 !important;
                background: #fffbe6 !important;
                border-bottom: 1.5pt solid #b89a30 !important;
                padding: 4pt 6pt;
                margin-bottom: 8pt;
            }

            /* 테이블 공통 */
            #print-area table {
                width: max-content;
                min-width: 100%;
                border-collapse: collapse !important;
                table-layout: auto;
                margin-bottom: 10pt;
                page-break-inside: auto;
            }
            #print-area thead { display: table-header-group; }
            #print-area tr    { page-break-inside: avoid; }

            /* th — 연한 금색 배경 + 진한 갈색 텍스트 */
            #print-area th {
                background: #fdf3d0 !important;
                color: #4a3800 !important;
                font-size: 7.5pt;
                font-weight: bold;
                padding: 4pt 3pt;
                border: 0.6pt solid #c8a838 !important;
                text-align: center;
            }

            /* td — 흰 배경 + 검정 텍스트 */
            #print-area td {
                font-size: 7pt;
                padding: 3pt 2pt;
                border: 0.4pt solid #ccc !important;
                color: #1a1a1a !important;
                background: #fff !important;
                text-align: center;
            }

            /* 짝수 행 아주 연한 베이지 */
            #print-area tbody tr:nth-child(even) td {
                background: #fafaf5 !important;
            }

            /* ── 상태값 색상 (의미가 있는 색은 유지) ── */
            /* OK/양호 — 파란색 계열 */
            #print-area td[data-st="ok"],
            #print-area td[data-st="O"]  { color: #1a4fa0 !important; font-weight: bold; }
            /* NG/이상 — 빨간색 계열 */
            #print-area td[data-st="ng"],
            #print-area td[data-st="X"]  { color: #b50000 !important; font-weight: bold; }
            /* 경고 */
            #print-area td[data-st="warn"] { color: #8a6000 !important; font-weight: bold; }

            /* AOI 불량수 — 붉은색 강조 */
            #print-area .defect-total-col,
            #print-area [style*="danger-red"] { color: #b50000 !important; }

            /* 생산실적 구분선 (골드 세로선) */
            #print-area td[style*="rgba(255, 235, 167"] {
                background: #c8a838 !important;
                padding: 0 !important;
                width: 2px !important;
            }

            /* progress bar 숨김 */
            #print-area .qty-progress-track,
            #print-area .qty-progress-fill { display: none !important; }

            /* 누적/lot 텍스트 */
            #print-area .acc-val { color: #1a1a1a !important; font-weight: bold; }
            #print-area .lot-val { color: #666 !important; }

            /* 섹션 소제목 */
            #print-area .print-section-title {
                display: block !important;
                font-size: 9pt;
                font-weight: bold;
                color: #4a3800 !important;
                background: #fffbe6 !important;
                border-left: 3pt solid #c8a838 !important;
                padding: 3pt 6pt;
                margin: 8pt 0 3pt;
                page-break-after: avoid;
            }

            /* input 값 텍스트만 표시 */
            #print-area input {
                border: none !important;
                background: transparent !important;
                color: #1a1a1a !important;
                padding: 0;
                font-size: 7pt;
            }
            #print-area button { display: none !important; }
        }
    </style>
</head>

<body>
    <svg style="position: absolute; width: 0; height: 0;" class="svg-sprite">
        <defs>
            <filter id="filter">
                <feTurbulence type="fractalNoise" baseFrequency="0.01 0.004" numOctaves="1" result="warp">
                </feTurbulence>
                <feDisplacementMap xChannelSelector="R" yChannelSelector="G" scale="30" in="SourceGraphic" in2="warp">
                </feDisplacementMap>
            </filter>
        </defs>
    </svg>

    <div class="page-container">
        <header class="main-header">
            <div class="header-left">
                <a href="javascript:void(0)" onclick="goToHome()" class="ppms-logo-placeholder"></a>
            </div>
            <div class="header-center">
                <div class="common-box font-35pt">통계 분석</div>
            </div>
            <div class="header-right">
                <div class="common-box time-display" id="current-time"></div>
            </div>
        </header>

        <main class="content-area">

            <div class="analysis-toolbar">
                <div class="tab-group">
                    <div class="tab-btn active" data-tab="production"><i class="uil uil-chart-line"></i> 생산 실적</div>
                    <div class="tab-btn" data-tab="aoi"><i class="uil uil-microscope"></i> AOI 분석</div>
                    <div class="tab-btn" data-tab="inspection"><i class="uil uil-clipboard-alt"></i> 점검시트</div>
                </div>

                <div id="production-controls" class="control-wrapper active">
                    <input type="number" id="order-year-input" class="compact-input" placeholder="2026"
                        style="width:70px;">
                    <select id="order-month-select" class="compact-select"></select>
                    <div class="common-box clickable-box compact-btn" id="search-prod-btn"><i
                            class="uil uil-search"></i> 조회</div>
                    <button class="pdf-btn" id="pdf-prod-btn" onclick="downloadPdf('prod')">
                        <i class="uil uil-file-download"></i> PDF
                    </button>
                </div>

                <div id="aoi-controls" class="control-wrapper">
                    <div class="period-toggle">
                        <div class="period-option active" data-type="weekly">주간</div>
                        <div class="period-option" data-type="monthly">월간</div>
                    </div>

                    <div style="display:flex; align-items:center; gap:5px; color:#ccc; font-size:0.9rem;">
                        <select id="aoi-year-select" class="compact-select"></select>년
                        <select id="aoi-month-select" class="compact-select"></select>월
                        <span id="week-select-wrapper"><select id="aoi-week-select"
                                class="compact-select"></select>주</span>
                    </div>

                    <div class="common-box clickable-box compact-btn" id="search-aoi-btn"><i class="uil uil-search"></i>
                        분석</div>
                    <div id="period-info-text" style="color:var(--point-gold); font-size:0.8rem; font-weight:bold;">
                    </div>
                    <button class="pdf-btn" id="pdf-aoi-btn" onclick="downloadPdf('aoi')">
                        <i class="uil uil-file-download"></i> PDF
                    </button>
                </div>

                <!-- 점검시트 컨트롤 -->
                <div id="inspection-controls" class="control-wrapper">
                    <div class="period-toggle">
                        <div class="period-option active" data-sheet="vision">비전</div>
                        <div class="period-option" data-sheet="esd">제전화</div>
                        <div class="period-option" data-sheet="smd">SMD설비</div>
                        <div class="period-option" data-sheet="wave">Wave</div>
                        <div class="period-option" data-sheet="metal">MetalMask</div>
                        <div class="period-option" data-sheet="env">환경</div>
                        <div class="period-option" data-sheet="ac">AC누설</div>
                    </div>
                    <div style="display:flex; align-items:center; gap:5px; color:#ccc; font-size:0.9rem;">
                        <select id="insp-year-select" class="compact-select"></select>년
                        <select id="insp-month-select" class="compact-select"></select>월
                    </div>
                    <div class="common-box clickable-box compact-btn" id="search-insp-btn">
                        <i class="uil uil-search"></i> 조회
                    </div>
                    <button class="pdf-btn" id="pdf-insp-btn" onclick="downloadPdf('insp')">
                        <i class="uil uil-file-download"></i> PDF
                    </button>
                </div>
            </div>

            <div id="statistics-result-area">
                <div id="prod-table-container" class="table-container" style="display:none;"></div>
                <div id="aoi-summary-container" class="table-container"
                    style="display:none; margin-bottom: 15px; border: 2px solid var(--point-gold);">
                </div>
                <div id="aoi-table-container" class="table-container" style="display:none;">
                    <table class="aoi-table" id="aoi-table-main">
                        <colgroup>
                            <col style="width: 200px;">
                            <col style="width: clamp(70px, 6vw, 120px);">
                            <col style="width: clamp(70px, 6vw, 120px);" class="detail-col group-basic">
                            <col style="width: clamp(70px, 6vw, 120px);" class="detail-col group-basic good-col">
                            <col style="width: clamp(70px, 6vw, 120px);">

                            <col style="width: clamp(70px, 6vw, 120px);" class="detail-col group-a">
                            <col style="width: clamp(70px, 6vw, 120px);" class="detail-col group-a">
                            <col style="width: clamp(70px, 6vw, 120px);" class="detail-col group-a">
                            <col style="width: clamp(70px, 6vw, 120px);" class="detail-col group-a">
                            <col style="width: clamp(70px, 6vw, 120px);" class="detail-col group-a">

                            <col style="width: clamp(70px, 6vw, 120px);" class="detail-col group-b">
                            <col style="width: clamp(70px, 6vw, 120px);" class="detail-col group-b">
                            <col style="width: clamp(70px, 6vw, 120px);" class="detail-col group-b">

                            <col style="width: clamp(70px, 6vw, 120px);" class="detail-col group-c">
                            <col style="width: clamp(70px, 6vw, 120px);" class="detail-col group-c">
                            <col style="width: clamp(70px, 6vw, 120px);" class="detail-col group-c">

                            <col style="width: clamp(70px, 6vw, 120px);" class="detail-col group-d">
                            <col style="width: clamp(70px, 6vw, 120px);" class="detail-col group-d">
                        </colgroup>
                        <thead>
                            <tr>
                                <th rowspan="2" class="model-name-ellipsis" style="text-align:center;">모델명</th>
                                <th rowspan="2">수량</th>
                                <th rowspan="2" class="detail-col group-basic">진행도</th>
                                <th rowspan="2" class="detail-col group-basic good-col">양품</th>
                                <th rowspan="2" class="defect-total-col">총불량</th>

                                <th colspan="5" class="detail-col group-a group-header-box">실장오류</th>
                                <th colspan="3" class="detail-col group-b group-header-box">부품결함</th>
                                <th colspan="3" class="detail-col group-c group-header-box">납땜불량</th>
                                <th colspan="2" class="detail-col group-d group-header-box">기타</th>
                            </tr>
                            <tr>
                                <th class="detail-col group-a group-start">미삽</th>
                                <th class="detail-col group-a">오삽</th>
                                <th class="detail-col group-a">역삽</th>
                                <th class="detail-col group-a">틀어짐</th>
                                <th class="detail-col group-a group-end">뒤집힘</th>

                                <th class="detail-col group-b group-start">파손</th>
                                <th class="detail-col group-b">맨하탄</th>
                                <th class="detail-col group-b group-end">이탈</th>

                                <th class="detail-col group-c group-start">냉납</th>
                                <th class="detail-col group-c">미납</th>
                                <th class="detail-col group-c group-end">쇼트</th>

                                <th class="detail-col group-d group-start">자재</th>
                                <th class="detail-col group-d group-end">DIP</th>
                            </tr>
                        </thead>
                        <tbody id="aoi-list-body">
                        </tbody>
                    </table>
                </div>

                <!-- 점검시트 결과 영역 -->
                <div id="insp-container" style="display:none; width:100%; padding: 10px 20px; box-sizing:border-box; overflow-y:auto;">
                </div>

                <p class="no-line-data-message" style="margin-top:50px;">
                    <i class="uil uil-mouse-alt" style="font-size:2rem; display:block; margin-bottom:10px;"></i>
                    분석할 내용을 선택해주세요.
                </p>
            </div>
        </main>

        <footer class="main-footer">
            <div class="footer-left"></div>
            <div class="footer-center">
                <div class="footer-btn" id="back-btn"><i class="uil uil-arrow-left"></i></div>
                <div class="footer-btn" id="home-btn"><i class="uil uil-home"></i></div>
                <div class="footer-btn" id="forward-btn"><i class="uil uil-arrow-right"></i></div>
            </div>
            <div class="footer-right"></div>
        </footer>

        <div id="global-tooltip">
            <textarea id="editor-textarea" readonly></textarea>
        </div>

        <div id="model-tooltip-simple"></div>

        <div class="modal-overlay" id="details-modal">
            <div class="modal-window">
                <button class="close-btn" id="close-details-modal-btn">&times;</button>
                <h2 class="modal-title" id="details-modal-title">상세 내역</h2>
                <div class="modal-content" id="details-modal-content"></div>
            </div>
        </div>
    </div>

    <script>
        /* ============================================================
           [1] 내비게이션 & 전역 함수 정의 (최상단)
           ============================================================ */
        window.goToPage = function (url) {
            document.body.style.opacity = '0';
            setTimeout(() => { location.href = url; }, 500);
        };

        window.goToHome = function () { window.goToPage('/'); };

        window.goBack = function () {
            document.body.style.opacity = '0';
            setTimeout(() => {
                // 히스토리가 있으면 이전으로, 없으면 관리자 맵 루트로 이동
                if (window.history.length > 1) {
                    history.back();
                } else {
                    location.href = '/api/production/admin_view';
                }
            }, 500);
        };

        window.goForward = function () { history.forward(); };

        // 모달 내 링크 클릭 시 상태 저장 및 이동
        window.handleModalLinkClick = function (url, model, year, month) {
            sessionStorage.setItem('returnToModal', JSON.stringify({ model, year, month }));
            window.goToPage(url);
        };

        // 모델 상세 모달 오픈 함수
        window.openModelDetails = async function (model, year, month) {
            const modal = document.getElementById('details-modal');
            const mContent = document.getElementById('details-modal-content');
            const mTitle = document.getElementById('details-modal-title');
            
            mTitle.textContent = `${model} 상세`;
            modal.classList.add('visible');
            mContent.innerHTML = '<div style="text-align:center; padding:20px;">로딩 중...</div>';

            try {
                const res = await fetch(`/api/statistics/model_details?model=${encodeURIComponent(model)}&year=${year}&month=${encodeURIComponent(month)}`);
                const d = await res.json();

                let html = `<table class="statistics-table" style="width:100%"><thead><tr><th>생산년월</th><th>주차</th><th>라인</th><th>T/B</th><th>LOT</th><th>실적</th></tr></thead><tbody>`;
                d.forEach(r => {
                    // 링크는 주문년월이 아닌 실제 생산년월(prod_year, prod_month, prod_week) 기준으로 이동
                    const linkUrl = `/api/production/view?year=${r.prod_year}&month=${r.prod_month}&week=${r.prod_week}`;
                    html += `<tr>
                        <td style="color:#aaa; font-size:0.85rem;">${r.prod_year}년 ${r.prod_month}월</td>
                        <td><a href="javascript:void(0)" onclick="handleModalLinkClick('${linkUrl}', '${model}', '${year}', '${month}')">${r.prod_week}주</a></td>
                        <td>${r.line}</td><td>${r.tb}</td><td>${r.lot}</td><td>${r.actualProd}</td>
                    </tr>`;
                });
                html += `</tbody></table>`;
                mContent.innerHTML = html;
            } catch (err) { mContent.innerHTML = '데이터 로드 실패'; }
        };

        /* ============================================================
           [2] 메인 로직 (단일 DOMContentLoaded)
           ============================================================ */
        document.addEventListener('DOMContentLoaded', () => {
            // 1. 화면 페이드 인
            setTimeout(() => { document.body.style.opacity = '1'; }, 50);

            // 2. 로고 초기화 (중요)
            if (typeof PPMS_LOGO !== 'undefined' && PPMS_LOGO.init) {
                PPMS_LOGO.init();
            }

            // 3. 내비게이션 버튼 리스너 연결
            const btns = { 'back-btn': window.goBack, 'home-btn': window.goToHome, 'forward-btn': window.goForward };
            Object.keys(btns).forEach(id => {
                const el = document.getElementById(id);
                if (el) el.onclick = btns[id];
            });

            // 4. 모달 닫기 버튼
            const closeBtn = document.getElementById('close-details-modal-btn');
            if (closeBtn) closeBtn.onclick = () => document.getElementById('details-modal').classList.remove('visible');

            // 5. 뒤로가기로 돌아왔을 때 모달 자동 복구
            try {
                const returnData = sessionStorage.getItem('returnToModal');
                if (returnData) {
                    const data = JSON.parse(returnData);
                    if (data && data.model) window.openModelDetails(data.model, data.year, data.month);
                    sessionStorage.removeItem('returnToModal');
                }
            } catch (e) { console.error("모달 복구 오류:", e); }

            // === [기존 기능 로직 유지] ===

            // 로고 글리치 효과 (GSAP)
            const filter = document.querySelector('.svg-sprite');
            if (filter) {
                const turb = filter.querySelector('#filter feTurbulence');
                const glitchElements = document.querySelectorAll('.btn-glitch');
                let turbVal = { val: 0.000001 }, turbValX = { val: 0.000001 };
                let timeline = new TimelineMax({
                    repeat: -1, repeatDelay: 2, paused: true,
                    onUpdate: function () { turb.setAttribute('baseFrequency', turbVal.val + ' ' + turbValX.val); }
                });
                timeline.to(turbValX, 0.1, { val: 0.5 }).to(turbVal, 0.1, { val: 0.02 })
                    .set(turbValX, { val: 0.000001 }).set(turbVal, { val: 0.000001 })
                    .to(turbValX, 0.2, { val: 0.4 }, 0.4).to(turbVal, 0.2, { val: 0.002 }, 0.4)
                    .set(turbValX, { val: 0.000001 }).set(turbVal, { val: 0.000001 });
                glitchElements.forEach(el => {
                    el.addEventListener('mouseenter', function () { this.classList.add('btn-glitch-active'); timeline.restart(); });
                    el.addEventListener('mouseleave', function () { this.classList.remove('btn-glitch-active'); timeline.pause(); gsap.set(turbVal, { val: 0 }); gsap.set(turbValX, { val: 0 }); turb.setAttribute('baseFrequency', '0.000001 0.000001'); });
                });
            }

            // DOM 요소 참조
            const resultArea = document.getElementById('statistics-result-area');
            const noMsg = resultArea.querySelector('.no-line-data-message');
            const prodTableContainer = document.getElementById('prod-table-container');
            const aoiTableContainer = document.getElementById('aoi-table-container');
            const tbody = document.getElementById('aoi-list-body');
            const tabs = document.querySelectorAll('.tab-btn');
            const prodControls = document.getElementById('production-controls');
            const aoiControls = document.getElementById('aoi-controls');
            const inspControls = document.getElementById('inspection-controls');
            const inspContainer = document.getElementById('insp-container');

            // 점검시트 연도/월 select 초기화
            const inspYearSel  = document.getElementById('insp-year-select');
            const inspMonthSel = document.getElementById('insp-month-select');
            const nowInsp = new Date();
            for (let y = nowInsp.getFullYear() - 1; y <= nowInsp.getFullYear() + 1; y++) {
                inspYearSel.innerHTML += `<option value="${y}" ${y === nowInsp.getFullYear() ? 'selected' : ''}>${y}</option>`;
            }
            for (let m = 1; m <= 12; m++) {
                inspMonthSel.innerHTML += `<option value="${m}" ${m === (nowInsp.getMonth()+1) ? 'selected' : ''}>${m}</option>`;
            }

            // 날짜 선택기 초기화 (생산 기준)
            const monthSelect = document.getElementById('order-month-select');
            const yearInput = document.getElementById('order-year-input');
            yearInput.value = new Date().getFullYear();
            monthSelect.innerHTML = '<option value="">월 선택</option>';
            for (let i = 1; i <= 12; i++) {
                const selected = i === (new Date().getMonth() + 1) ? 'selected' : '';
                monthSelect.innerHTML += `<option value="${i}" ${selected}>${i}월</option>`;
            }

            const aoiYearSel = document.getElementById('aoi-year-select');
            const aoiMonthSel = document.getElementById('aoi-month-select');
            const aoiWeekSel = document.getElementById('aoi-week-select');
            const now = new Date(); const curYear = now.getFullYear();
            for (let y = curYear - 1; y <= curYear + 1; y++) aoiYearSel.innerHTML += `<option value="${y}" ${y === curYear ? 'selected' : ''}>${y}</option>`;
            for (let m = 1; m <= 12; m++) aoiMonthSel.innerHTML += `<option value="${m}" ${m === (now.getMonth() + 1) ? 'selected' : ''}>${m}</option>`;
            for (let w = 1; w <= 5; w++) aoiWeekSel.innerHTML += `<option value="${w}">${w}</option>`;

            // 탭 전환 로직
            function hideAll() {
                const summaryContainer = document.getElementById('aoi-summary-container');
                aoiTableContainer.style.display = 'none';
                prodTableContainer.style.display = 'none';
                inspContainer.style.display = 'none';
                if (summaryContainer) summaryContainer.style.display = 'none';
                prodControls.classList.remove('active');
                aoiControls.classList.remove('active');
                inspControls.classList.remove('active');
                // PDF 버튼 숨김
                ['pdf-prod-btn','pdf-aoi-btn','pdf-insp-btn'].forEach(id => {
                    const el = document.getElementById(id);
                    if (el) el.classList.remove('visible');
                });
            }

            tabs.forEach(tab => {
                tab.addEventListener('click', () => {
                    tabs.forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');
                    hideAll();

                    if (tab.dataset.tab === 'production') {
                        prodControls.classList.add('active');
                        noMsg.style.display = 'flex'; noMsg.innerHTML = '<i class="uil uil-search" style="font-size:2rem; display:block; margin-bottom:10px;"></i> 조건을 선택하고 조회를 눌러주세요.';
                    } else if (tab.dataset.tab === 'aoi') {
                        aoiControls.classList.add('active');
                        noMsg.style.display = 'flex'; noMsg.innerHTML = '<i class="uil uil-search" style="font-size:2rem; display:block; margin-bottom:10px;"></i> 조건을 선택하고 분석을 눌러주세요.';
                    } else if (tab.dataset.tab === 'inspection') {
                        inspControls.classList.add('active');
                        noMsg.style.display = 'flex'; noMsg.innerHTML = '<i class="uil uil-search" style="font-size:2rem; display:block; margin-bottom:10px;"></i> 연도와 월을 선택하고 조회를 눌러주세요.';
                    }
                });
            });

            // AOI 분석 로직
            let periodType = 'weekly';
            const periodOpts = document.querySelectorAll('.period-option');
            const weekWrap = document.getElementById('week-select-wrapper');
            const infoText = document.getElementById('period-info-text');

            periodOpts.forEach(opt => {
                opt.addEventListener('click', () => {
                    periodOpts.forEach(o => o.classList.remove('active')); opt.classList.add('active');
                    periodType = opt.dataset.type;
                    weekWrap.style.display = (periodType === 'monthly') ? 'none' : 'inline';
                    updatePeriodText();
                });
            });
            [aoiYearSel, aoiMonthSel, aoiWeekSel].forEach(el => el.addEventListener('change', updatePeriodText));

            function getDates() {
                const y = parseInt(aoiYearSel.value), m = parseInt(aoiMonthSel.value);
                if (periodType === 'monthly') {
                    return { start: new Date(y, m - 1, 1), end: new Date(y, m, 0) };
                } else {
                    const w = parseInt(aoiWeekSel.value);
                    // calendar.js getWeekNumber()와 동일한 기준: 1일의 요일(일=0) 기반 일요일 시작 주
                    const dayOfWeek    = new Date(y, m - 1, 1).getDay();
                    const lastDayOfMonth = new Date(y, m, 0).getDate();

                    const startDayNum  = (w - 1) * 7 - dayOfWeek + 1;
                    const endDayNum    = w * 7 - dayOfWeek;

                    const finalStartDay = Math.max(1, startDayNum);
                    const finalEndDay   = Math.min(lastDayOfMonth, endDayNum);

                    if (finalStartDay > lastDayOfMonth) return { start: new Date(y, m, 0), end: new Date(y, m, 0) };
                    return { start: new Date(y, m - 1, finalStartDay), end: new Date(y, m - 1, finalEndDay) };
                }
            }

            function updatePeriodText() {
                const { start, end } = getDates();
                const fmt = d => `${d.getMonth() + 1}/${d.getDate()}`;
                infoText.textContent = `${fmt(start)} ~ ${fmt(end)}`;
            }
            updatePeriodText();

            document.getElementById('search-aoi-btn').addEventListener('click', async () => {
                const { start, end } = getDates();
                const fmt = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
                noMsg.style.display = 'flex'; noMsg.innerHTML = '분석 중...';
                aoiTableContainer.style.display = 'none'; prodTableContainer.style.display = 'none';
                try {
                    const res = await fetch(`/api/statistics/aoi_performance?start_date=${fmt(start)}&end_date=${fmt(end)}`);
                    const data = await res.json();
                    renderAoi(data);
                } catch (e) { noMsg.innerHTML = '실패'; }
            });

            // 생산 실적 테이블 렌더링
            function renderProdTable(data) {
                if (!data || data.length === 0) {
                    noMsg.style.display = 'flex'; noMsg.innerHTML = '데이터 없음';
                    return;
                }
                noMsg.style.display = 'none';
                prodTableContainer.style.display = 'block';
                document.getElementById('pdf-prod-btn').classList.add('visible');

                let html = `
                    <table class="statistics-table" style="width:100%; table-layout:fixed; border-collapse: separate; border-spacing: 0;">
                        <colgroup>
                            <col style="width: 25%;"> <col style="width: 25%;"> <col style="width: 2px;"> <col style="width: 25%;"> <col style="width: 25%;"> </colgroup>
                        <thead>
                            <tr>
                                <th>모델명</th>
                                <th>LOT / 실생산</th>
                                <th style="padding:0; background:transparent; border:none;"></th> <th>모델명</th>
                                <th>LOT / 실생산</th>
                            </tr>
                        </thead>
                        <tbody>`;

                for (let i = 0; i < data.length; i += 2) {
                    const item1 = data[i];
                    const item2 = data[i + 1];
                    html += `<tr>`;
                    html += createProdCells(item1);
                    html += `<td style="padding:0; background:rgba(255, 235, 167, 0.6); border:none;"></td>`;
                    if (item2) html += createProdCells(item2);
                    else html += `<td></td><td></td>`;
                    html += `</tr>`;
                }
                html += `</tbody></table>`;
                prodTableContainer.innerHTML = html;
            }

            function createProdCells(item) {
                let statusClass = '';
                if (item.status === 'shortage') statusClass = 'stats-problem-yellow';
                else if (item.status === 'imbalance') statusClass = 'stats-problem-red';
                const lot    = item.totalQuantity.toLocaleString();
                const actual = item.actualProduction.toLocaleString();
                // 주문월 정보를 작은 글씨로 표시 (같은 모델의 서로 다른 주문 구별용)
                const orderLabel = item.orderMonth
                    ? `<div style="font-size:0.72rem; color:#666; margin-top:2px;">${item.orderYear}년 ${item.orderMonth} 주문분</div>`
                    : '';
                return `
                    <td style="color:#fff; font-weight:bold; text-align:center;">
                        ${item.model}
                        ${orderLabel}
                    </td>
                    <td style="text-align:center;">
                        <span class="stats-lot-val">${lot}</span>
                        <span style="color:#666; margin:0 5px;">/</span>
                        <span class="stats-clickable-val ${statusClass}" 
                              data-model="${item.model}" 
                              data-year="${item.orderYear}" 
                              data-month="${item.orderMonth}">
                            ${actual}
                        </span>
                    </td>
                `;
            }

            // 실적 클릭 시 모달 열기 리스너
            document.addEventListener('click', (e) => {
                const target = e.target.closest('.stats-clickable-val');
                if (target) {
                    const { model, year, month } = target.dataset;
                    window.openModelDetails(model, year, month);
                }
            });

            // AOI 렌더링 함수
            function renderAoi(data) {
                const summaryContainer = document.getElementById('aoi-summary-container');
                if (!data || data.length === 0) {
                    noMsg.style.display = 'flex';
                    noMsg.innerHTML = '<i class="uil uil-file-slash" style="font-size:3.5rem; margin-bottom:15px;"></i> 데이터가 없습니다.';
                    aoiTableContainer.style.display = 'none';
                    summaryContainer.style.display = 'none';
                    return;
                }
                noMsg.style.display = 'none';
                aoiTableContainer.style.display = 'block';
                summaryContainer.style.display = 'block';
                document.getElementById('pdf-aoi-btn').classList.add('visible');

                let gTotalInsp = 0, gTotalDefect = 0;
                const gDefects = {
                    reverse: 0, missing: 0, wrong: 0, skewed: 0, flipped: 0,
                    damaged: 0, manhattan: 0, detached: 0,
                    cold: 0, unsoldered: 0, short: 0,
                    material: 0, dip: 0
                };

                data.forEach(r => {
                    gTotalInsp += (parseInt(r.inspection_qty) || 0);
                    gTotalDefect += (parseInt(r.total_defect) || 0);
                    for (let key in gDefects) {
                        gDefects[key] += (parseInt(r[key]) || 0);
                    }
                });

                // 불량 포인트 총합 (13개 유형 합산) - 비율 계산 분모로 사용
                const gTotalPoints = Object.values(gDefects).reduce((a, b) => a + b, 0);

                const defectRate = gTotalInsp > 0 ? ((gTotalDefect / gTotalInsp) * 100).toFixed(2) : 0;
                const getValStr = (val) => {
                    const rate = gTotalPoints > 0 ? Math.round((val / gTotalPoints) * 100) : 0;
                    return `${rate}% (${val})`;
                };

                summaryContainer.innerHTML = `
        <table class="summary-table">
            <colgroup>
                <col style="width:6%;"> <col style="width:10%;"> <col span="3" style="width:5%;">
                <col span="13" style="width:auto;"> 
                <col style="width:5%;">
            </colgroup>
            <tr>
                <th rowspan="3" class="summary-title-cell">전체 현황</th>
                <th rowspan="3" class="summary-label-cell">PBA 불량율<br>(총 검사수 대비)</th>
                <th class="summary-label-cell">검사수</th>
                <th class="summary-label-cell">불량수</th>
                <th class="summary-label-cell">불량율</th>

                const topPos = (rect.top + window.scrollY + (rect.height / 2)) - 26;
                let leftPos;
                if (rect.right + 250 + 20 < window.innerWidth) {
                    leftPos = rect.right + 12; viewer.classList.add('pos-right');
                } else {

            const METAL_EQUIPMENT = 'Metal Mask Washer';
            const WAVE_EQUIPMENT  = 'Auto Solder';
            const AC_LINES = { A:['LOADER','PRINTER','Mounter1','Mounter2','Mounter3','WORK TABLE','Reflow','UNLOADER'], B:['LOADER','PRINTER','Mounter1','Mounter2','Mounter3','WORK TABLE','Reflow','UNLOADER'], C:['LOADER','PRINTER','Mounter1','WORK TABLE','제습기','CONVECTION OVEN'] };

            function renderInspectionTables(year, month, holidays, sheetType, extra) {
                const lastDay = new Date(year, month, 0).getDate();
                const DAY_NAMES = ['일','월','화','수','목','금','토'];
                const pad = n => String(n).padStart(2,'0');
                const ds  = d => `${year}-${pad(month)}-${pad(d)}`;
                const isWorkday = (dateStr, dow) => dow!==0 && dow!==6 && !holidays[dateStr];
                const workdays = [];
                for (let d=1;d<=lastDay;d++) {
                    const dateStr=ds(d), dow=new Date(year,month-1,d).getDay();
                    if (!isWorkday(dateStr,dow)) continue;
                    workdays.push({d, dateStr, dow});
                }
                const thBase = `background:#1a1b21;color:var(--point-gold);font-family:'BMDOHYEON';padding:6px 4px;font-size:.82rem;border:1px solid #3a3b47;position:sticky;top:0;z-index:10;white-space:nowrap;`;
                const tdBase = `border:1px solid #2e2f3a;text-align:center;padding:3px 2px;font-size:.82rem;white-space:nowrap;`;
                const tableWrap = inner =>
                    `<div style="overflow-x:auto;border:1px solid var(--border-color);border-radius:10px;margin-bottom:8px;">
                        <table style="width:100%;border-collapse:collapse;table-layout:auto;">${inner}</table></div>`;
                const titleBar = title =>
                    `<div style="font-family:'BMDOHYEON';font-size:1.1rem;color:var(--point-gold);margin-bottom:12px;padding-bottom:6px;border-bottom:1px solid var(--border-color);">
                        ${year}년 ${month}월 — ${title}</div>`;
                const makeDayHeaders = () => workdays.map(({d,dow}) =>
                    `<th title="${DAY_NAMES[dow]}" style="${thBase}min-width:28px;">${d}</th>`).join('');

                if (sheetType === 'vision') {
                    const {vision1, vision2} = extra;
                    const vSt = s => s==='ok'?'background:rgba(78,115,223,.2);color:#4e73df;font-weight:bold;':s==='ng'?'background:rgba(255,68,68,.2);color:var(--danger-red);font-weight:bold;':'color:#333;';
                    const makeVT = (data, label) => {
                        let row = `<tr><td style="${tdBase}background:#1c1d26;position:sticky;left:0;z-index:5;padding:3px 8px;border-right:2px solid var(--point-gold);">점검 상태</td>`;
                        workdays.forEach(({dateStr}) => { const s=data[dateStr]||''; row+=`<td style="${tdBase}${vSt(s)}" data-st="${s}">${s==='ok'?'OK':s==='ng'?'NG':''}</td>`; });
                        row+='</tr>';
                        return tableWrap(`<thead><tr><th style="${thBase}position:sticky;left:0;z-index:15;padding:6px 8px;border-right:2px solid var(--point-gold);">${label}</th>${makeDayHeaders()}</tr></thead><tbody>${row}</tbody>`);
                    };
                    return titleBar('비전 장비 일일 점검') + makeVT(vision1,'1호기 (A-Line)') + makeVT(vision2,'2호기 (B-Line)');
                }
                if (sheetType === 'esd') {
                    const {managers, esdMap} = extra;
                    const getComb = (s,w) => { if(s===w)return s; if(s==='X'||w==='X')return 'X'; if(s==='C'||w==='C')return 'C'; if(s==='O'||w==='O')return 'O'; return ''; };
                    const eSt = s => s==='O'?'background:rgba(0,230,118,.12);color:var(--success-green);font-weight:bold;':s==='X'?'background:rgba(255,68,68,.15);color:var(--danger-red);font-weight:bold;':s==='C'?'background:rgba(255,235,167,.1);color:var(--point-gold);font-weight:bold;':'color:#333;';
                    let rows='';
                    managers.forEach(mgr => {
                        rows+=`<tr><td style="${tdBase}background:#1c1d26;position:sticky;left:0;z-index:5;text-align:left;padding:3px 8px;border-right:2px solid var(--point-gold);"><span style="font-weight:bold;color:#fff;font-size:.82rem;">${mgr.name}</span></td>`;
                        workdays.forEach(({dateStr}) => { const c=esdMap[`${dateStr}_${mgr.id}`]||{}; const s=getComb(c.shoes||'',c.wrist||''); rows+=`<td style="${tdBase}${eSt(s)}" data-st="${s}">${s}</td>`; });
                        rows+='</tr>';
                    });
                    return titleBar('제전화 및 손목띠 점검') + tableWrap(`<thead><tr><th style="${thBase}position:sticky;left:0;z-index:15;padding:6px 8px;border-right:2px solid var(--point-gold);">성명</th>${makeDayHeaders()}</tr></thead><tbody>${rows}</tbody>`);
                }
                if (sheetType === 'smd') {
                    const {equipData} = extra;
                    const sSt = s => s==='O'?'background:rgba(78,115,223,.15);color:#4e73df;font-weight:bold;':s==='△'?'background:rgba(255,235,167,.1);color:var(--point-gold);font-weight:bold;':s==='X'?'background:rgba(255,68,68,.15);color:var(--danger-red);font-weight:bold;':s==='□'?'background:rgba(0,230,118,.1);color:var(--success-green);font-weight:bold;':'color:#333;';
                    let html = titleBar('SMD 설비 일일점검');
                    Object.entries(SMD_EQUIPMENTS).forEach(([equip, items]) => {

                            rows+='</tr>';
                        });
                        html+=tableWrap(`<thead><tr><th style="${thBase}position:sticky;left:0;z-index:15;padding:6px 8px;border-right:2px solid var(--point-gold);min-width:130px;">${equip}</th>${makeDayHeaders()}</tr></thead><tbody>${rows}</tbody>`);
                    });
                    return html;
                }
                if (sheetType === 'wave') {
                    const {equipData} = extra;
                    const wSt = s => s==='V'?'background:rgba(78,115,223,.15);color:#4e73df;font-weight:bold;':s==='△'?'background:rgba(255,235,167,.1);color:var(--point-gold);font-weight:bold;':s==='X'?'background:rgba(255,68,68,.15);color:var(--danger-red);font-weight:bold;':s==='☆'?'background:rgba(255,50,50,.25);color:#ff1744;font-weight:bold;':'color:#333;';
                    let rows='';
                    WAVE_ITEMS.forEach((name,idx) => {
                        const no=idx+1;
                        rows+=`<tr><td style="${tdBase}background:#1c1d26;position:sticky;left:0;z-index:5;text-align:left;padding:3px 8px;border-right:2px solid var(--point-gold);min-width:150px;font-size:.78rem;">${no}. ${name}</td>`;
                        workdays.forEach(({dateStr}) => { const k=`${WAVE_EQUIPMENT}_${no}_${dateStr}`; const s=(equipData[k]||{}).status||''; rows+=`<td style="${tdBase}${wSt(s)}" data-st="${s}">${s}</td>`; });
                        rows+='</tr>';
                    });
                    return titleBar('Wave Solder 점검') + tableWrap(`<thead><tr><th style="${thBase}position:sticky;left:0;z-index:15;padding:6px 8px;border-right:2px solid var(--point-gold);min-width:150px;">점검 사항</th>${makeDayHeaders()}</tr></thead><tbody>${rows}</tbody>`);
                }
                if (sheetType === 'metal') {
                    const {equipData} = extra;
                    const mSt = s => s==='O'?'background:rgba(78,115,223,.15);color:#4e73df;font-weight:bold;':s==='X'?'background:rgba(255,68,68,.15);color:var(--danger-red);font-weight:bold;':'color:#333;';
                    let rows='';
                    METAL_ITEMS.forEach((name,idx) => {
                        rows+=`<tr><td style="${tdBase}background:#1c1d26;position:sticky;left:0;z-index:5;text-align:left;padding:3px 8px;border-right:2px solid var(--point-gold);min-width:170px;font-size:.78rem;">${name}</td>`;
                        workdays.forEach(({dateStr}) => { const k=`${METAL_EQUIPMENT}_${idx}_${dateStr}`; const r=equipData[k]||{}; const v=idx===0?(r.checker||''):(r.status||''); rows+=`<td style="${tdBase}${idx>0?mSt(v):''}" data-st="${v}">${v}</td>`; });
                        rows+='</tr>';
                    });
                    return titleBar('Metal Mask 세척기 점검') + tableWrap(`<thead><tr><th style="${thBase}position:sticky;left:0;z-index:15;padding:6px 8px;border-right:2px solid var(--point-gold);min-width:170px;">항목</th>${makeDayHeaders()}</tr></thead><tbody>${rows}</tbody>`);
                }
                if (sheetType === 'env') {
                    const {fridge, room, dehumid} = extra;
                    const SECS = [
                        {label:'냉장고 온도',data:fridge, rows:[{slot:'10:00',name:'온도(℃)',field:'temperature',isToggle:true}]},
                        {label:'실내 온·습도',data:room,  rows:[{slot:'10:00',name:'온도 10시',field:'temperature'},{slot:'10:00',name:'습도 10시',field:'humidity'},{slot:'18:00',name:'온도 18시',field:'temperature'},{slot:'18:00',name:'습도 18시',field:'humidity'}]},
                        {label:'제습함 온·습도',data:dehumid,rows:[{slot:'10:00',name:'온도(℃)',field:'temperature'},{slot:'10:00',name:'습도(%RH)',field:'humidity'}]},
                    ];
                    const tSt = s => s==='O'?'background:rgba(78,115,223,.15);color:#4e73df;font-weight:bold;':s==='X'?'background:rgba(255,68,68,.15);color:var(--danger-red);font-weight:bold;':'color:#333;';
                    let html=titleBar('환경 점검');
                    SECS.forEach(sec => {
                        let rows='';
                        sec.rows.forEach(row => {
                            rows+=`<tr><td style="${tdBase}background:#1c1d26;position:sticky;left:0;z-index:5;text-align:left;padding:3px 8px;border-right:2px solid var(--point-gold);min-width:100px;font-size:.78rem;">${row.name}</td>`;
                            workdays.forEach(({dateStr}) => { const k=`${dateStr}_${row.slot}`; const rec=sec.data[k]||{}; const v=row.isToggle?(rec.status||''):(rec[row.field]!==null&&rec[row.field]!==undefined?rec[row.field]:''); rows+=`<td style="${tdBase}${row.isToggle?tSt(v):''}">${v}</td>`; });
                            rows+='</tr>';
                        });
                        html+=tableWrap(`<thead><tr><th style="${thBase}position:sticky;left:0;z-index:15;padding:6px 8px;border-right:2px solid var(--point-gold);min-width:100px;">${sec.label}</th>${makeDayHeaders()}</tr></thead><tbody>${rows}</tbody>`);
                    });
                    return html;
                }
                if (sheetType === 'ac') {
                    const {acData} = extra;
                    const MONTHS=['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
                    let rows='';
                    Object.entries(AC_LINES).forEach(([line,equips]) => {
                        equips.forEach((equip,i) => {
                            rows+=`<tr>${i===0?`<td style="${tdBase}background:#1c1d26;position:sticky;left:0;z-index:5;font-family:'BMDOHYEON';" rowspan="${equips.length}">${line}</td>`:''}<td style="${tdBase}background:#1c1d26;position:sticky;left:34px;z-index:5;text-align:left;padding:3px 8px;border-right:2px solid var(--point-gold);min-width:100px;font-size:.78rem;">${equip}</td>`;
                            for(let m=1;m<=12;m++){const k=`${line}_${equip}_${m}`;const rec=acData[k]||{};const v=rec.voltage!==null&&rec.voltage!==undefined?rec.voltage:'';const isNg=v!==''&&parseFloat(v)>5;rows+=`<td style="${tdBase}${isNg?'color:var(--danger-red);background:rgba(255,68,68,.1);font-weight:bold;':v!==''?'color:var(--success-green);':''}" data-st="${isNg?'ng':v!==''?'ok':''}">${v}</td>`;}
                            rows+='</tr>';
                        });
                    });
                    const mH=MONTHS.map((m,i)=>`<th style="${thBase}min-width:52px;${i+1===month?'background:#1e2535!important;border-bottom:2px solid var(--point-gold)!important;':''}">${m}</th>`).join('');
                    return titleBar(`AC 누설전류 점검 (${year}년)`) + tableWrap(`<thead><tr><th style="${thBase}position:sticky;left:0;z-index:15;min-width:34px;">라인</th><th style="${thBase}position:sticky;left:34px;z-index:15;min-width:100px;border-right:2px solid var(--point-gold);">설비</th>${mH}</tr></thead><tbody>${rows}</tbody>`);
                }
                return '';
            }

            // ================================================================
            // [PDF 출력 — window.print()]
            // ================================================================
            window.downloadPdf = function(type) {
                const btn = document.getElementById(`pdf-${type}-btn`);
                const origText = btn.innerHTML;
                btn.innerHTML = '<i class="uil uil-spinner-alt"></i> 준비 중...';
                btn.disabled = true;

                // ── 제목 결정 ────────────────────────────────────────────
                let title = 'PPMS';
                if (type === 'prod') {
                    const yy = document.getElementById('order-year-input').value;
                    const mm = document.getElementById('order-month-select').value;
                    title = `PPMS  |  생산 실적 — ${yy}년 ${mm}월`;
                } else if (type === 'aoi') {
                    const info = document.getElementById('period-info-text').textContent.trim();
                    title = `PPMS  |  AOI 분석 — ${info}`;
                } else if (type === 'insp') {
                    const yy = document.getElementById('insp-year-select').value;
                    const mm = document.getElementById('insp-month-select').value;
                    const label = document.querySelector('#inspection-controls .period-option.active')?.textContent?.trim() || '';
                    title = `PPMS  |  점검시트 — ${label}  ${yy}년 ${mm}월`;
                }

                // ── 소스 컨테이너 결정 ───────────────────────────────────
                let srcEls = [];
                if (type === 'prod')  srcEls = [document.getElementById('prod-table-container')];
                else if (type === 'aoi')  srcEls = [
                    document.getElementById('aoi-summary-container'),
                    document.getElementById('aoi-table-container')
                ];
                else if (type === 'insp') srcEls = [document.getElementById('insp-container')];

                // ── print-area 에 복사 ───────────────────────────────────
                const printArea   = document.getElementById('print-area');
                const printHeader = document.getElementById('print-header');
                const printBody   = document.getElementById('print-body');

                const now = new Date().toLocaleString('ko-KR');
                printHeader.textContent = `${title}　　　　${now}`;
                printBody.innerHTML = '';

                // 클론된 요소의 overflow/max-height 인라인 스타일 제거 헬퍼
                function stripScrollStyles(el) {
                    el.querySelectorAll('*').forEach(node => {
                        if (node.style) {
                            node.style.overflow   = '';
                            node.style.overflowX  = '';
                            node.style.overflowY  = '';
                            node.style.maxHeight  = '';
                            node.style.maxWidth   = '';
                            node.style.height     = '';
                        }
                    });
                    // 루트 요소 자체도
                    if (el.style) {
                        el.style.overflow  = '';
                        el.style.overflowX = '';
                        el.style.overflowY = '';
                        el.style.maxHeight = '';
                        el.style.height    = '';
                    }
                }

                srcEls.forEach(el => {
                    if (!el || el.style.display === 'none') return;

                    if (type === 'insp') {
                        Array.from(el.children).forEach(child => {
                            const clone = child.cloneNode(true);
                            if (child.tagName === 'DIV' && !child.querySelector('table')) {
                                clone.className = 'print-section-title';
                            }
                            const origInputs  = child.querySelectorAll('input');
                            const cloneInputs = clone.querySelectorAll('input');
                            origInputs.forEach((inp, i) => { if (cloneInputs[i]) cloneInputs[i].value = inp.value; });
                            stripScrollStyles(clone);
                            printBody.appendChild(clone);
                        });
                    } else {
                        const clone = el.cloneNode(true);
                        const origInputs  = el.querySelectorAll('input');
                        const cloneInputs = clone.querySelectorAll('input');
                        origInputs.forEach((inp, i) => { if (cloneInputs[i]) cloneInputs[i].value = inp.value; });
                        stripScrollStyles(clone);
                        printBody.appendChild(clone);
                    }
                });

                // ── 인쇄 실행 ───────────────────────────────────────────
                // print-area를 잠깐 표시해야 @media print가 인식
                printArea.style.display = 'block';
                setTimeout(() => {
                    window.print();
                    // 인쇄 다이얼로그 닫힌 후 원복
                    printArea.style.display = 'none';
                    btn.innerHTML = origText;
                    btn.disabled = false;
                }, 100);
            };

                        // 시간 업데이트
            function updateTime() {
                const n = new Date();
                const el = document.getElementById('current-time');
                if (el) {
                    el.textContent = n.toLocaleString('ko-KR', {
                        year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit'
                    });
                }
            }
            setInterval(updateTime, 1000);
            updateTime();
        });

        // BFCache 대응 (뒤로가기 시 화면 복구)
        window.addEventListener('pageshow', (event) => {
            document.body.style.opacity = '1';
        });
    </script>
</body>
</html>

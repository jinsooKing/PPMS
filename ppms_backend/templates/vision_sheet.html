<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PPMS - 비젼 장비 점검</title>
    <link rel="stylesheet" href="/static/common.css">
    <link rel="stylesheet" href="https://unicons.iconscout.com/release/v4.0.8/css/line.css">
    <link href="https://hangeul.pstatic.net/hangeul_static/css/bmdohyeon.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css?family=Poppins:400,600,800" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="/static/logo.js"></script>

    <style>
        :root { --success-blue: #4e73df; }

        /* 드래그 중 텍스트 선택 방지 */
        .calendar-grid { user-select: none; -webkit-user-select: none; }

        /* content-area 안 전체 래퍼: 남은 공간을 flex-column으로 채움 */
        .vision-inner {
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 1200px;
            height: 100%;
            gap: 8px;
            box-sizing: border-box;
        }

        /* 탭 */
        .machine-tabs { flex: 0 0 auto; display: flex; justify-content: center; gap: 10px; }
        .tab-btn {
            background: #1a1a1a; border: 1px solid #444; color: #888;
            padding: 6px 25px; border-radius: 8px; font-family: 'BMDOHYEON';
            font-size: clamp(0.8rem, 1.5vw, 1rem); cursor: pointer; transition: all 0.2s;
        }
        .tab-btn.active { background: var(--point-gold); color: #1f2029; font-weight: bold; }
        .tab-btn:hover:not(.active) { border-color: var(--point-gold); color: var(--point-gold); }

        /* 가이드 패널 */
        .guide-panel {
            flex: 0 0 auto;
            background: var(--card-bg); border: 1px solid var(--border-color);
            border-radius: 10px; padding: 10px 15px;
            display: flex; justify-content: space-between; gap: 15px;
        }
        .guide-section { flex: 1; display: flex; flex-direction: column; justify-content: center; min-width: 0; }
        .guide-title {
            font-family: 'BMDOHYEON'; color: var(--point-gold);
            font-size: 0.9rem; margin-bottom: 4px;
            display: flex; align-items: center; gap: 5px;
        }
        .guide-list { margin: 0; padding-left: 0; list-style: none; font-size: 0.8rem; color: #bbb; line-height: 1.5; }
        .guide-list li { display: flex; align-items: center; gap: 4px; }

        /* 달력 래퍼: 나머지 공간 전부 */
        .calendar-wrapper {
            flex: 1; min-height: 0;
            display: flex; flex-direction: column;
            background: var(--card-bg); border-radius: 12px;
            padding: 10px; border: 1px solid var(--border-color); overflow: hidden;
        }
        .calendar-wrapper .calendar-header {
            flex: 0 0 auto;
            display: flex !important; justify-content: space-between !important;
            align-items: center !important; margin-bottom: 8px !important;
            color: inherit !important; font-size: inherit !important; padding: 0 !important;
        }
        .month-display { font-family: 'BMDOHYEON'; font-size: 1.3rem; color: #fff; }
        .cal-nav-btn {
            background: none; border: 1px solid #555; color: var(--point-gold);
            width: 30px; height: 30px; border-radius: 50%; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            font-size: 1rem; transition: all 0.2s;
        }
        .cal-nav-btn:hover { background: var(--point-gold); color: #1f2029; }

        .day-names {
            flex: 0 0 auto; display: grid; grid-template-columns: repeat(7, 1fr);
            margin-bottom: 5px; text-align: center;
        }
        .day-name { font-family: 'BMDOHYEON'; color: #666; font-size: 0.8rem; }
        .day-name.sun { color: var(--danger-red); }

        .calendar-grid {
            flex: 1; min-height: 0;
            display: grid; grid-template-columns: repeat(7, 1fr);
            grid-template-rows: repeat(6, 1fr);
            gap: 5px; position: relative; z-index: 1;
        }

        /* 날짜 셀 */
        .calendar-grid .day-cell {
            background: #1f2029 !important; border: 1px solid #333 !important;
            border-radius: 6px !important; position: relative !important;
            display: flex !important; flex-direction: column !important;
            justify-content: space-between !important; padding: 5px !important;
            transition: all 0.2s !important; cursor: pointer !important;
            pointer-events: auto !important; height: auto !important; overflow: hidden !important;
        }
        .calendar-grid .day-cell:hover { border-color: var(--point-gold) !important; background: #252730 !important; }
        .calendar-grid .day-cell * { pointer-events: none !important; }

        .day-num { font-size: 0.85rem; font-weight: 600; color: #888; line-height: 1; }
        .calendar-grid .day-cell.holiday .day-num { color: var(--danger-red); }

        .status-icon {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%) scale(0.5);
            font-size: clamp(1.2rem, 2.5vw, 2rem); opacity: 0;
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes todayShimmer { 0% { left: -60%; } 100% { left: 160%; } }
        @keyframes todayBadgeIn { from { opacity:0; transform:translateY(3px); } to { opacity:1; transform:translateY(0); } }

        .calendar-grid .day-cell.today {
            border: 1px solid rgba(255,235,167,0.2) !important;
            border-top: 2px solid var(--point-gold) !important;
            background: rgba(255,235,167,0.04) !important;
        }
        .calendar-grid .day-cell.today::before {
            content: ''; position: absolute; top: 0; left: -60%; width: 45%; height: 2px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.75), transparent);
            animation: todayShimmer 3s cubic-bezier(0.4,0,0.6,1) infinite 1s;
            pointer-events: none; z-index: 3;
        }
        .calendar-grid .day-cell.today::after {
            content: 'TODAY'; position: absolute; bottom: 4px; right: 5px;
            font-size: 0.38rem; font-family: 'Poppins'; font-weight: 700;
            letter-spacing: 0.14em; color: var(--point-gold); opacity: 0.55;
            animation: todayBadgeIn 0.6s ease forwards; pointer-events: none; z-index: 2;
        }
        .calendar-grid .day-cell.today .day-num { color: var(--point-gold); font-weight: 800; position: relative; z-index: 3; }

        .calendar-grid .day-cell.status-ok { background: rgba(78,115,223,0.12) !important; border: 1px solid var(--success-blue) !important; }
        .calendar-grid .day-cell.status-ok .icon-ok { opacity: 1; transform: translate(-50%,-50%) scale(1); color: var(--success-blue); }
        .calendar-grid .day-cell.status-ng { background: rgba(255,68,68,0.12) !important; border: 1px solid var(--danger-red) !important; }
        .calendar-grid .day-cell.status-ng .icon-ng { opacity: 1; transform: translate(-50%,-50%) scale(1); color: var(--danger-red); }

        .calendar-grid .day-cell.today.status-ok { background: rgba(78,115,223,0.15) !important; border: 1px solid var(--success-blue) !important; border-top: 2px solid var(--success-blue) !important; }
        .calendar-grid .day-cell.today.status-ok .day-num { color: var(--success-blue); }
        .calendar-grid .day-cell.today.status-ok::before { background: linear-gradient(90deg, transparent, rgba(78,115,223,0.6), transparent); }
        .calendar-grid .day-cell.today.status-ng { background: rgba(255,68,68,0.15) !important; border: 1px solid var(--danger-red) !important; border-top: 2px solid var(--danger-red) !important; }
        .calendar-grid .day-cell.today.status-ng .day-num { color: var(--danger-red); }
        .calendar-grid .day-cell.today.status-ng::before { background: linear-gradient(90deg, transparent, rgba(255,68,68,0.6), transparent); }
        .calendar-grid .day-cell.today.status-ok::after,
        .calendar-grid .day-cell.today.status-ng::after { display: none; }

        /* 헤더 PDF 버튼 → footer 우측용 */
        .pdf-btn {
            background: transparent; border: 1px solid #555; color: #bbb;
            padding: 0 15px; height: 100%; border-radius: 8px; cursor: pointer;
            font-size: 0.9rem; display: flex; align-items: center; gap: 6px;
            transition: all 0.2s; font-family: 'BMDOHYEON'; white-space: nowrap;
        }
        .pdf-btn:hover { background: var(--point-gold); color: #1f2029; border-color: var(--point-gold); }
    </style>
</head>
<body>
    <div class="page-container">

        <header class="main-header">
            <div class="header-left">
                <a href="javascript:void(0)" onclick="goToHome()" class="ppms-logo-placeholder"></a>
            </div>
            <div class="header-center">
                <div class="common-box font-35pt">비젼 장비 일일 점검</div>
            </div>
            <div class="header-right">
                <div class="common-box font-15pt time-display" id="current-time"></div>
            </div>
        </header>

        <main class="content-area">
            <div class="vision-inner">

                <div class="machine-tabs">
                    <div class="tab-btn active" onclick="switchMachine(1)">1호기 (A-Line)</div>
                    <div class="tab-btn" onclick="switchMachine(2)">2호기 (B-Line)</div>
                </div>

                <div class="guide-panel">
                    <div class="guide-section">
                        <div class="guide-title"><i class="uil uil-mouse-alt"></i> 상태 표시 (터치)</div>
                        <ul class="guide-list">
                            <li><i class="uil uil-check" style="color:var(--success-blue)"></i> <strong>1회 (파랑)</strong>: 정상 (OK)</li>
                            <li><i class="uil uil-times" style="color:var(--danger-red)"></i> <strong>2회 (빨강)</strong>: 이상 (NG)</li>
                            <li><i class="uil uil-circle"></i> <strong>3회</strong>: 초기화</li>
                        </ul>
                    </div>
                    <div class="guide-section" style="border-left:1px solid #444; padding-left:15px;">
                        <div class="guide-title"><i class="uil uil-check-square"></i> 필수 점검</div>
                        <ul class="guide-list">
                            <li>1. 레일 동작 및 이음</li>
                            <li>2. PC/SW 구동 상태</li>
                            <li>3. 비상버튼 동작</li>
                            <li>4. 렌즈/조명 청결</li>
                        </ul>
                    </div>
                </div>

                <div class="calendar-wrapper">
                    <div class="calendar-header">
                        <button class="cal-nav-btn" onclick="moveMonth(-1)"><i class="uil uil-angle-left"></i></button>
                        <div class="month-display" id="current-month-str"></div>
                        <button class="cal-nav-btn" onclick="moveMonth(1)"><i class="uil uil-angle-right"></i></button>
                    </div>
                    <div class="day-names">
                        <div class="day-name sun">SUN</div>
                        <div class="day-name">MON</div>
                        <div class="day-name">TUE</div>
                        <div class="day-name">WED</div>
                        <div class="day-name">THU</div>
                        <div class="day-name">FRI</div>
                        <div class="day-name">SAT</div>
                    </div>
                    <div class="calendar-grid" id="calendar-grid"></div>
                </div>

            </div>
        </main>

        <footer class="main-footer">
            <div class="footer-left"></div>
            <div class="footer-center">
                <div class="footer-btn" onclick="goBack()"><i class="uil uil-arrow-left"></i></div>
                <div class="footer-btn" onclick="goToHome()"><i class="uil uil-home"></i></div>
                <div class="footer-btn" onclick="goForward()"><i class="uil uil-arrow-right"></i></div>
            </div>
            <div class="footer-right">
                <button class="pdf-btn" onclick="downloadPDF()">
                    <i class="uil uil-file-download-alt"></i> PDF 저장
                </button>
            </div>
        </footer>

    </div>

    <!-- Fade-in: body 최하단 배치 (dip.html 패턴) -->
    <style>
        body { opacity: 0; transition: opacity 0.5s ease-in-out; }
    </style>

    <script>
        let holidays = {};
        let viewYear  = new Date().getFullYear();
        let viewMonth = new Date().getMonth() + 1;
        let activeMachine = 1;
        const machineData = { 1: {}, 2: {} };

        async function init() {
            document.getElementById('current-month-str').textContent = `${viewYear}년 ${viewMonth}월`;
            await fetchHolidays(viewYear);
            await loadData();
        }

        async function fetchHolidays(year) {
            try {
                const res = await fetch(`/api/inspection/holidays?year=${year}`);
                if (res.ok) holidays = await res.json();
            } catch (e) { console.error("공휴일 로드 실패", e); }
        }

        async function loadData() {
            try {
                const res = await fetch(`/api/inspection/vision/monthly?year=${viewYear}&month=${viewMonth}&machine_id=${activeMachine}`);
                if (res.ok) machineData[activeMachine] = await res.json();
                else machineData[activeMachine] = {};
            } catch (e) { machineData[activeMachine] = {}; }
            renderCalendar();
        }

        // ── 드래그 상태 ───────────────────────────────────────────────────
        let isDragging    = false;
        let dragStatus    = null;   // 드래그 세션 동안 적용할 상태
        let draggedCells  = [];     // 드래그 중 변경된 셀 목록 {el, dateStr, prevStatus}

        function updateCellStatus(el, status) {
            el.dataset.status = status;
            el.classList.remove('status-ok', 'status-ng');
            if (status === 'ok') el.classList.add('status-ok');
            if (status === 'ng')  el.classList.add('status-ng');
        }

        // 단일 셀에 상태 적용 (드래그 or 클릭 공통)
        async function applyStatus(el, dateStr, status, prevStatus) {
            // 변경 전 상태와 목표 상태가 같으면 무시
            if (prevStatus === status) return; 
            
            updateCellStatus(el, status);
            try {
                const res = await fetch('/api/inspection/vision/toggle', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ date: dateStr, machine_id: activeMachine, status })
                });
                if (!res.ok) throw new Error('서버 에러');
                machineData[activeMachine][dateStr] = status;
            } catch (e) {
                alert("서버 통신 실패: 체크 상태를 저장하지 못했습니다.");
                // 실패 시 변경 전(prevStatus) 상태로 복구
                updateCellStatus(el, prevStatus);
            }
        }

        // ── 달력 그리드에 드래그 이벤트 위임 ────────────────────────────
        const grid = () => document.getElementById('calendar-grid');

        document.addEventListener('mousedown', (e) => {
            const el = e.target.closest('.day-cell');
            if (!el || !grid().contains(el)) return;
            e.preventDefault();
            const current = el.dataset.status || 'empty';
            dragStatus   = current === 'empty' ? 'ok' : (current === 'ok' ? 'ng' : 'empty');
            isDragging   = true;
            draggedCells = [];
            applyDragToCell(el);
        });

        document.addEventListener('mouseenter', (e) => {
            if (!isDragging) return;
            const el = e.target.closest('.day-cell');
            if (!el || !grid().contains(el)) return;
            applyDragToCell(el);
        }, true);

        document.addEventListener('mouseup', () => {
            if (!isDragging) return;
            isDragging = false;
            
            // 드래그 종료 후 변경된 셀 일괄 저장
            // [핵심 수정] 기억해둔 원래 상태(prevStatus)를 applyStatus에 함께 전달합니다.
            draggedCells.forEach(({ el, dateStr, prevStatus }) => {
                applyStatus(el, dateStr, dragStatus, prevStatus);
            });
            
            draggedCells = [];
            dragStatus   = null;
        });

        // 드래그 중 UI만 즉시 반영 (서버 저장은 mouseup에서)
        function applyDragToCell(el) {
            const dateStr = el.dataset.date;
            if (!dateStr) return;
            if (el.dataset.status === dragStatus) return; // 이미 같은 상태면 스킵
            if (draggedCells.find(c => c.el === el)) return; // 중복 스킵
            draggedCells.push({ el, dateStr, prevStatus: el.dataset.status || 'empty' });
            updateCellStatus(el, dragStatus);
        }

        function renderCalendar() {
            const grid = document.getElementById('calendar-grid');
            document.getElementById('current-month-str').textContent = `${viewYear}년 ${viewMonth}월`;
            const firstDay = new Date(viewYear, viewMonth - 1, 1).getDay();
            const lastDate = new Date(viewYear, viewMonth, 0).getDate();
            const todayObj = new Date();
            const todayStr = `${todayObj.getFullYear()}-${String(todayObj.getMonth()+1).padStart(2,'0')}-${String(todayObj.getDate()).padStart(2,'0')}`;

            let html = "", slots = 0;
            for (let i = 0; i < firstDay; i++) { html += `<div style="visibility:hidden;"></div>`; slots++; }
            for (let d = 1; d <= lastDate; d++) {
                const dateKey = `${viewYear}-${String(viewMonth).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
                const status  = (machineData[activeMachine] || {})[dateKey] || 'empty';
                const dayOfWeek = new Date(viewYear, viewMonth - 1, d).getDay();
                const isHoliday = !!(holidays[dateKey] || dayOfWeek === 0);
                let classes = 'day-cell';
                if (isHoliday) classes += ' holiday';
                if (dateKey === todayStr) classes += ' today';
                if (status === 'ok') classes += ' status-ok';
                if (status === 'ng') classes += ' status-ng';
                html += `
                    <div class="${classes}" data-status="${status}" data-date="${dateKey}">
                        <span class="day-num">${d}</span>
                        <i class="uil uil-check status-icon icon-ok"></i>
                        <i class="uil uil-times status-icon icon-ng"></i>
                    </div>`;
                slots++;
            }
            while (slots < 42) { html += `<div></div>`; slots++; }
            grid.innerHTML = html;
        }

        function switchMachine(num) {
            activeMachine = num;
            document.querySelectorAll('.tab-btn').forEach((btn, i) => btn.classList.toggle('active', i + 1 === num));
            loadData();
        }

        async function moveMonth(delta) {
            const oldYear = viewYear;
            viewMonth += delta;
            if (viewMonth > 12) { viewMonth = 1; viewYear++; }
            else if (viewMonth < 1) { viewMonth = 12; viewYear--; }
            if (oldYear !== viewYear) await fetchHolidays(viewYear);
            loadData();
        }

        function downloadPDF() {
            if (confirm(`${viewYear}년 ${viewMonth}월 점검표 (1호기 + 2호기)를 통합 PDF로 다운로드하시겠습니까?`)) {
                window.location.href = `/api/inspection/vision/export_pdf?year=${viewYear}&month=${viewMonth}`;
            }
        }

        // Fade-in: pageshow는 bfcache 복원 시에도 항상 실행됨
        window.addEventListener('pageshow', function() {
            setTimeout(() => { document.body.style.opacity = '1'; }, 50);
        });

        // 현재 시각 표시 (aoi.html 동일 패턴)
        function updateTime() {
            const now = new Date();
            const str = `${now.getFullYear()}년 ${now.getMonth()+1}월 ${now.getDate()}일 ${now.getHours()}시 ${now.getMinutes()}분`;
            const el  = document.getElementById('current-time');
            if (el) el.textContent = str;
        }
        setInterval(updateTime, 1000);
        updateTime();

        window.goBack    = function () { document.body.style.opacity = '0'; setTimeout(() => { history.back();        }, 500); };
        window.goToHome  = function () { document.body.style.opacity = '0'; setTimeout(() => { location.href = '/';  }, 500); };
        window.goForward = function () { document.body.style.opacity = '0'; setTimeout(() => { history.forward();    }, 500); };

        window.onload = init;
    </script>
</body>
</html>
